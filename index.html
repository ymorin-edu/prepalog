<script>
  /* Pose le thème avant le premier rendu : sans cela, l'écran clignote en blanc
     pendant une fraction de seconde au chargement en mode sombre. */
  try {
    var t = localStorage.getItem('prepalog:theme');
    if (t === 'clair' || t === 'sombre') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
