# Lance la suite de tests à chaque push et à chaque demande de fusion.
# Elle ne BLOQUE rien : le site est servi directement depuis `main`, un push est en ligne
# tout de suite. Elle PRÉVIENT (croix rouge sur le commit, mail de GitHub) si quelque chose
# est cassé. Mode démonstration uniquement, comme en local : aucun accès au vrai Firebase.
#
# Depuis le 06/10/2026 (lot 1 de MOTEUR-tests-rapides), la suite est coupée en trois groupes
# (`GROUPES` dans outils/test.mjs) qui tournent EN MÊME TEMPS sur trois machines : trois coches
# « Tests 1, 2, 3 » par push. Un groupe rouge n'arrête pas les autres (fail-fast: false).
# Une 4e coche, « Tests séances », déroule ENT-1.1 → 1.2 → 1.3 dans l'ordre d'un élève et compare
# les écrans aux corrigés (outils/test-seances.mjs, port 8098 ; lot 4, 06/10/2026).

name: Tests

on:
  push:
  pull_request:

jobs:
  suite:
    name: Tests ${{ matrix.groupe }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        groupe: [1, 2, 3, séances]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Même installation qu'en local (voir CLAUDE.md) : rien n'est ajouté au dépôt.
      - name: Installer Playwright et xlsx
        run: npm install --no-save --no-package-lock playwright xlsx@0.18.5

      # Le navigateur téléchargé est gardé d'un passage à l'autre (lot 5 de MOTEUR-tests-rapides,
      # 06/10/2026), sous une clé qui porte la version de Playwright : une nouvelle version de
      # Playwright retélécharge son navigateur. Les bibliothèques du système, elles, ne se gardent pas.
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Navigateur gardé en réserve
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Installer Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Bibliothèques du système pour Chromium
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Suite de tests (${{ matrix.groupe }})
        env:
          GROUPE: ${{ matrix.groupe }}
        run: |
          if [ "$GROUPE" = "séances" ]; then commande="node outils/test-seances.mjs"; else commande="node outils/test.mjs --groupe $GROUPE"; fi
          $commande 2>&1 | tee sortie-tests.txt; exit "${PIPESTATUS[0]}"

      # En cas d'échec, remonte les cas fautifs dans le résumé du passage (lisible sans
      # ouvrir le journal complet).
      - name: Résumé des échecs
        if: failure()
        run: |
          # Suite : tout ce qui suit « === ÉCHECS === ». Séances : les cas « ✗ » et les écarts listés.
          { sed -n '/=== ÉCHECS ===/,$p' sortie-tests.txt; grep -E '^  (✗|- )' sortie-tests.txt; } | sort -u | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error::$l"
          done

  # Les règles de sécurité Firestore / Realtime Database, jouées contre les émulateurs
  # (outils/test-regles.mjs ; audit C2, 08/10/2026). Ce que la suite en mode démonstration ne voit jamais.
  regles:
    name: Tests règles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paquets de test (isolés dans outils/paquets)
        run: npm install --prefix outils/paquets firebase @firebase/rules-unit-testing firebase-tools

      # Les règles RTDB du dépôt portent un bloc _commentaire que l'émulateur refuse (voir tester-regles.bat).
      - name: Copie des règles RTDB sans commentaire
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('database.rules.json','utf8'));delete r._commentaire;fs.writeFileSync('outils/.rtdb-emulateur.json',JSON.stringify(r,null,2));"

      - name: Tests des règles
        run: outils/paquets/node_modules/.bin/firebase emulators:exec --project demo-prepalog --only firestore,database "node outils/test-regles.mjs"
