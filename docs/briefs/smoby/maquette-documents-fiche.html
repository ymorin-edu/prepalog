<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai ENT-5.1 — documents et fiche de sélection</title>
<style>
:root{ --fond:#f4f1ea; --panneau:#fdfbf7; --survol:#f9f6ef; --filet:#e3ded3; --encre:#1a1915; --douce:#555047;
  --ardoise:#107c41; --ardoise-fond:#107c41; --ardoise-clair:#e3f1e8; --terre:#9c620a; --rouge:#9d2727; --smoby:#006FA6; --r:4px; }
*{box-sizing:border-box}
body{margin:0; background:var(--fond); color:var(--encre); font-family:Inter,system-ui,"Segoe UI",sans-serif; font-size:15px; line-height:1.45}
button{font:inherit; color:inherit}
.essai{background:#fcf3e2; border-bottom:1px dashed var(--terre); padding:8px 16px; font-size:.88rem; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center}
.essai b{color:var(--terre)}
.essai .choix-var{display:inline-flex; border:1px solid var(--terre); border-radius:var(--r); overflow:hidden}
.essai .choix-var button{border:0; background:transparent; padding:5px 10px; cursor:pointer}
.essai .choix-var button[aria-pressed="true"]{background:var(--terre); color:#fff}
.essai .reset{border:1px solid var(--filet); background:var(--panneau); border-radius:var(--r); padding:4px 10px; cursor:pointer}

.bandeau{display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--panneau); border-bottom:3px solid var(--smoby)}
.bandeau img{width:44px; height:44px}
.bandeau .ent{font-weight:700}
.bandeau .ent small{display:block; font-weight:400; color:var(--douce); font-size:.82rem}
.bandeau .pousse{margin-left:auto; font-size:.85rem; color:var(--douce)}
.app{display:grid; grid-template-columns:190px 1fr; align-content:start; min-height:calc(100vh - 110px)}
nav{background:var(--panneau); border-right:1px solid var(--filet); padding:12px 8px}
nav button{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:var(--r); cursor:pointer}
nav button:hover{background:var(--survol)}
nav button[aria-current="page"]{color:var(--ardoise); font-weight:700; box-shadow:inset 3px 0 0 var(--ardoise)}
nav .badge{font-size:.75rem; border:1px solid var(--ardoise); color:var(--ardoise); border-radius:10px; padding:0 7px}
main{padding:16px 20px; min-width:0}
h2{margin:0 0 4px; font-size:1.25rem}
.note{color:var(--douce); font-size:.88rem}
.panneau{background:var(--panneau); border:1px solid var(--filet); border-radius:var(--r); padding:14px 16px; margin-top:12px}
.btn{border:1px solid var(--filet); background:var(--panneau); border-radius:var(--r); padding:7px 14px; cursor:pointer}
.btn:hover{background:var(--survol)}
.btn-p{background:var(--ardoise-fond); border-color:var(--ardoise-fond); color:#fff}
.btn-p:hover{background:#0c6635}
.lien{border:0; background:none; color:var(--ardoise); cursor:pointer; padding:0; text-decoration:underline}
:focus-visible{outline:3px solid var(--smoby); outline-offset:2px}

/* Messagerie */
.boite{display:grid; grid-template-columns:240px 1fr; gap:0; border:1px solid var(--filet); border-radius:var(--r); background:var(--panneau); min-height:420px}
.mlist{border-right:1px solid var(--filet)}
.mitem{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--filet); background:transparent; padding:10px 12px; cursor:pointer}
.mitem.on{background:var(--ardoise-clair)}
.mitem.nonlu .obj{font-weight:700}
.mitem .de{display:flex; justify-content:space-between; font-size:.85rem; color:var(--douce)}
.lecteur{padding:14px 18px; min-width:0}
.lecteur h3{margin:0 0 4px}
.pj-liste{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; padding-top:12px; border-top:1px solid var(--filet)}
.pj{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--filet); background:var(--fond); border-radius:var(--r); padding:6px 10px; cursor:pointer; font-size:.9rem}
.pj:hover{border-color:var(--ardoise)}
.pj.vu{border-color:var(--ardoise)}
.pj .vu-mark{color:var(--ardoise); font-size:.8rem}
.pj svg{flex:none}

/* Visionneuse de document */
.visio-tete{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px}
.visio-tete .titre{font-weight:700}
.visio-tete .pousse{margin-left:auto; display:flex; gap:6px}
.onglets{display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--filet); margin-bottom:12px}
.onglets button{border:1px solid transparent; border-bottom:0; background:transparent; padding:6px 10px; cursor:pointer; border-radius:var(--r) var(--r) 0 0; font-size:.9rem}
.onglets button[aria-selected="true"]{border-color:var(--filet); background:var(--panneau); color:var(--ardoise); font-weight:700; margin-bottom:-1px}
.feuille{display:flex; justify-content:center}

/* Côte à côte */
.cote{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
.cote .docs{position:sticky; top:8px; max-height:calc(100vh - 24px); overflow:auto; background:var(--fond); padding-right:4px}

/* Fiche de sélection */
table.tri{border-collapse:collapse; width:100%; font-size:.92rem}
table.tri th, table.tri td{border:1px solid var(--filet); padding:6px 8px; text-align:center}
table.tri th{background:var(--survol); font-weight:600}
table.tri td:first-child, table.tri th:first-child{text-align:left}
.on-off{display:inline-flex; gap:4px}
.on-off button{min-width:48px; border:1px solid var(--filet); background:var(--panneau); border-radius:var(--r); padding:3px 6px; cursor:pointer; color:var(--douce)}
.on-off button[aria-pressed="true"]{border:2px solid var(--ardoise); color:var(--ardoise); font-weight:700; padding:2px 5px}
.on-off button[aria-pressed="true"]::before{content:"✓ "}
.encadre{border-left:3px solid var(--terre); background:rgba(156,98,10,.07); padding:8px 12px; font-size:.9rem; margin:10px 0}
.encadre b:first-child{display:block; color:var(--terre)}
.champ{margin:12px 0}
.champ > label, .champ > .lib{display:block; font-weight:600; margin-bottom:4px}
select{font:inherit; padding:6px 8px; border:1px solid var(--filet); border-radius:var(--r); background:var(--panneau); min-width:220px}
.radios{display:flex; gap:16px}
.radios label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.manque{color:var(--rouge); font-size:.88rem; margin-top:8px}
.envoye{border:1px solid var(--ardoise); border-radius:var(--r); padding:8px 12px; color:var(--ardoise); margin-top:12px}
fieldset{border:0; padding:0; margin:0}
fieldset[disabled] .on-off button{cursor:default}

/* Mots cliquables */
.mot{border:0; background:none; padding:0; color:inherit; font:inherit; text-decoration:underline dotted var(--ardoise); text-underline-offset:3px; cursor:help; position:relative}
.bulle{position:absolute; z-index:5; left:0; top:1.6em; width:260px; background:var(--encre); color:#fff; font-size:.85rem; font-weight:400; padding:8px 10px; border-radius:var(--r); text-align:left; line-height:1.35}

/* Bilan */
.bilan li{margin:4px 0}
.ok{color:var(--ardoise); font-weight:700}
.ko{color:var(--rouge); font-weight:700}

/* Les documents (CV, fiche de poste) — repris de l'exemple validé */
.cv{background:#fdfbf7; border:1px solid var(--filet); width:540px; max-width:100%; box-shadow:0 2px 8px rgba(0,0,0,.08); color:#1a1915; font-size:14.5px}
.pied{font-size:.72rem; color:var(--douce); border-top:1px solid var(--filet); padding:6px 22px; text-align:right}
.ligne{display:grid; grid-template-columns:96px 1fr; gap:8px; margin:5px 0; font-size:.9rem}
.ligne .quand{color:var(--douce); font-size:.84rem}
.ligne b{display:block}
.cv ul{margin:4px 0; padding-left:18px; font-size:.9rem}
.recherche{background:rgba(156,98,10,.08); border-left:3px solid var(--terre); padding:7px 10px; font-size:.88rem; margin-top:12px}
/* 1 : bandeau à gauche (Yanis) */
.cv1{display:grid; grid-template-columns:170px 1fr}
.cv1 .gauche{background:rgba(16,124,65,.08); padding:22px 16px; font-size:.85rem}
.cv1 .gauche h3{font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:#107c41; margin:16px 0 6px}
.cv1 .gauche h3:first-child{margin-top:0}
.cv1 .gauche p{margin:2px 0}
.cv1 .droite{padding:22px 22px 14px}
.cv1 .nom{font-size:1.4rem; font-weight:800; margin:0}
.cv1 .titre{color:#107c41; font-weight:600; margin:2px 0 14px}
.cv1 h2{font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid #107c41; padding-bottom:3px; margin:14px 0 8px}
.cv1 .pied{grid-column:1 / -1}
/* 2 : classique centrée (Laura) */
.cv2 .corps{padding:24px 26px 14px}
.cv2 .nom{font-size:1.35rem; font-weight:700; text-align:center; margin:0; letter-spacing:.03em; text-transform:uppercase}
.cv2 .coord{text-align:center; color:var(--douce); font-size:.85rem; margin:4px 0 6px}
.cv2 .titre{text-align:center; font-weight:600; margin:0 0 14px; color:#9c620a}
.cv2 h2{font-size:.9rem; margin:14px 0 6px; color:#9c620a}
.cv2 h2::after{content:""; display:block; height:1px; background:var(--filet); margin-top:3px}
/* 3 : en-tête plein (Mehdi) */
.cv3 .tete{background:rgba(60,72,88,.12); padding:18px 24px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.cv3 .nom{font-size:1.3rem; font-weight:800; margin:0}
.cv3 .titre{margin:2px 0 0; font-weight:600; color:#3c4858}
.cv3 .coord{font-size:.82rem; text-align:right; color:var(--douce)}
.cv3 .coord p{margin:1px 0}
.cv3 .dispo{margin:0; padding:7px 24px; font-size:.88rem; border-bottom:1px solid var(--filet)}
.cv3 .corps{padding:12px 24px 14px; display:grid; grid-template-columns:1fr 150px; gap:18px}
.cv3 h2{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:#3c4858; margin:12px 0 6px}
.cv3 .cote3{border-left:1px solid var(--filet); padding-left:14px; font-size:.84rem}
.cv3 .cote3 p{margin:3px 0}
/* 4 : tableau (Thomas) */
.cv4 .corps{padding:22px 24px 14px}
.cv4 .nom{font-size:1.25rem; font-weight:700; margin:0}
.cv4 .titre{margin:0 0 12px; color:var(--douce)}
.cv4 table{border-collapse:collapse; width:100%; font-size:.88rem}
.cv4 th{width:120px; text-align:left; vertical-align:top; padding:7px 10px 7px 0; color:#7a4a8c; font-weight:700; border-top:1px solid var(--filet)}
.cv4 td{padding:7px 0; border-top:1px solid var(--filet); vertical-align:top}
.cv4 td p{margin:0 0 4px}
/* 5 : profil en tête, colonne à droite (Sabrina) */
.cv5{display:grid; grid-template-columns:1fr 165px}
.cv5 .principal{padding:22px 20px 14px 24px}
.cv5 .nom{font-size:1.35rem; font-weight:300; margin:0; letter-spacing:.02em}
.cv5 .nom b{font-weight:800}
.cv5 .titre{margin:2px 0 10px; font-size:.9rem; color:#a33f6f; font-weight:600}
.cv5 .profil{font-style:italic; font-size:.9rem; border-top:1px solid var(--filet); border-bottom:1px solid var(--filet); padding:8px 0; margin:0 0 6px}
.cv5 h2{font-size:.85rem; color:#a33f6f; margin:12px 0 5px}
.cv5 .droite5{background:rgba(163,63,111,.07); padding:22px 14px; font-size:.83rem}
.cv5 .droite5 h3{font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; margin:14px 0 5px; color:#a33f6f}
.cv5 .droite5 h3:first-child{margin-top:0}
.cv5 .droite5 p{margin:2px 0}
.cv5 .pied{grid-column:1 / -1}
/* Fiche de poste */
.fp .tete{display:flex; gap:12px; align-items:center; padding:16px 24px; border-bottom:3px solid var(--smoby)}
.fp .tete img{width:52px; height:52px}
.fp .tete p{margin:0}
.fp .tete .t{font-size:1.2rem; font-weight:800}
.fp .corps{padding:12px 24px 14px}
.fp h2{font-size:.88rem; text-transform:uppercase; letter-spacing:.05em; color:var(--smoby); margin:14px 0 6px}
.fp dl{display:grid; grid-template-columns:150px 1fr; gap:4px 10px; margin:0; font-size:.9rem}
.fp dt{color:var(--douce)}
.fp dd{margin:0}
.fp .caces{border:1px solid var(--smoby); border-radius:var(--r); padding:8px 12px; font-size:.88rem; margin-top:12px}
.fp .caces b:first-child{color:var(--smoby)}

@media (max-width:900px){
  .app{grid-template-columns:1fr; min-height:0}
  nav{align-self:start}
  nav{display:flex; gap:4px; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--filet)}
  nav button{width:auto}
  .cote{grid-template-columns:1fr}
  .cote .docs{position:static; max-height:none}
  .boite{grid-template-columns:1fr}
  .mlist{border-right:0; border-bottom:1px solid var(--filet)}
}
</style>
</head>

    <button data-var="B" aria-pressed="false">B — documents et fiche côte à côte</button>

const DOC = Object.fromEntries(DOCS.map((d) => [d.id, d]));

/* ---------------------------------------------------------------- état */
let V = 'A';
let E;
function initial() {
  E = { vue: 'accueil', mailSel: null, doc: null, docCote: 'poste', vus: {}, lu: false,
        tri: {}, candidat: '', contrat: '', envoye: null, manque: '' };
}
initial();

/* ---------------------------------------------------------------- écrans */
function vueAccueil() {
  return `<h2>Bonjour Camille</h2>
    <p>Tu arrives en renfort au service RH de Smoby. Ta tutrice, Sophie Martin, t'a écrit.</p>
    <section class="panneau"><p style="margin:0">Commence par lire son message dans la <button class="lien" data-aller="mail">Messagerie</button>.</p></section>`;
}

const iconePJ = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>';

function piecesJointes() {
  return `<div class="pj-liste" aria-label="Pièces jointes">${DOCS.map((d) =>
    `<button class="pj ${E.vus[d.id] ? 'vu' : ''}" data-pj="${d.id}">${iconePJ}${ech(d.court)}${E.vus[d.id] ? ' <span class="vu-mark">· ouvert</span>' : ''}</button>`).join('')}</div>`;
}

function visionneuse(id, avecRetour) {
  const k = DOCS.findIndex((d) => d.id === id), d = DOCS[k];
  const prec = DOCS[k - 1], suiv = DOCS[k + 1];
  return `<div class="visio-tete">
      ${avecRetour ? '<button class="lien" data-retour-mail>← Retour au message</button>' : ''}
      <span class="titre">${ech(d.titre)}</span>
      <span class="pousse">
        <button class="btn" data-pj="${prec ? prec.id : ''}" ${prec ? '' : 'disabled'}>‹ Précédent</button>
        <button class="btn" data-pj="${suiv ? suiv.id : ''}" ${suiv ? '' : 'disabled'}>Suivant ›</button>
      </span></div>
    <div class="feuille">${d.html}</div>`;
}

function vueMail() {
  const mail = `<button class="mitem ${E.lu ? '' : 'nonlu'} ${E.mailSel ? 'on' : ''}" data-ouvrir-mail>
      <span class="de"><span>Sophie Martin</span><span>30/11/2026</span></span>
      <span class="obj">Recrutement du cariste de Noël</span></button>`;
  let lecteur = '<p class="note">Sélectionnez un message pour le lire.</p>';
  if (E.mailSel && E.doc) lecteur = visionneuse(E.doc, true);
  else if (E.mailSel) {
    lecteur = `<h3>Recrutement du cariste de Noël</h3>
      <p class="note">De : Sophie Martin &lt;sophie.martin@smoby.exemple&gt; · 30/11/2026 09:12</p>
      <p>Bonjour Camille, bienvenue au service RH !</p>
      <p>Pour le pic de Noël, la plateforme a besoin d'un ${mot('cariste')} en ${mot('CDD')} ${mot('saisonnier')}, à partir du <b>mercredi 9 décembre</b>.</p>
      <p>Voici la ${mot('fiche de poste')} et les 5 CV reçus. Remplis la fiche de sélection, puis dis-moi qui tu retiens.</p>
      <p>Sophie</p>
      ${piecesJointes()}
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn btn-p" data-aller="fiche">Ouvrir la fiche de sélection</button>
        <button class="btn" disabled title="Déjà construit (lot 2) : non repris dans cette page d'essai">Répondre</button>
      </div>`;
  }
  return `<h2>Messagerie</h2><p class="note">Adresse : camille@smoby.exemple</p>
    <div class="boite" style="margin-top:12px"><div class="mlist">${mail}</div><div class="lecteur">${lecteur}</div></div>`;
}

function formulaire() {
  const fige = !!E.envoye;
  const lignes = CANDIDATS.map((c) => `<tr><td>${ech(c.nom)}</td>${COLONNES.map((col) => {
    const v = (E.tri[c.id] || {})[col.id];
    return `<td><span class="on-off" role="group" aria-label="${ech(c.nom)} — ${ech(col.lib)}">
      <button type="button" data-tri="${c.id}|${col.id}|1" aria-pressed="${v === true}">oui</button>
      <button type="button" data-tri="${c.id}|${col.id}|0" aria-pressed="${v === false}">non</button></span></td>`;
  }).join('')}</tr>`).join('');
  return `<form id="fiche" class="panneau" style="margin-top:0">
    <fieldset ${fige ? 'disabled' : ''}>
    <h3 style="margin:0 0 6px">1. Tableau de tri</h3>
    <p class="note" style="margin:0 0 8px">Pour chaque candidat, coche oui ou non dans chaque colonne. Lis les CV : les informations ne sont pas au même endroit.</p>
    <div style="overflow-x:auto"><table class="tri">
      <thead><tr><th>Candidat</th>${COLONNES.map((c) => `<th>${ech(c.lib)}</th>`).join('')}</tr></thead>
      <tbody>${lignes}</tbody></table></div>

    <h3 style="margin:18px 0 6px">2. Mon choix</h3>
    <div class="champ"><label for="cand">Je retiens</label>
      <select id="cand"><option value="">Choisir un candidat…</option>
      ${CANDIDATS.map((c) => `<option value="${c.id}" ${E.candidat === c.id ? 'selected' : ''}>${ech(c.nom)}</option>`).join('')}</select></div>
    <div class="champ"><span class="lib" id="lib-contrat">Contrat proposé</span>
      <div class="radios" role="radiogroup" aria-labelledby="lib-contrat">
        <label><input type="radio" name="contrat" value="CDD" ${E.contrat === 'CDD' ? 'checked' : ''}> CDD</label>
        <label><input type="radio" name="contrat" value="CDI" ${E.contrat === 'CDI' ? 'checked' : ''}> CDI</label></div></div>
    <div class="encadre"><b>CDD ou CDI ?</b>
      <b style="display:inline; color:inherit">CDI</b> : contrat sans date de fin. <b style="display:inline; color:inherit">CDD</b> : contrat avec une date de fin, pour un besoin limité
      dans le temps (un pic d'activité, un remplacement). Le <b style="display:inline; color:inherit">CDD saisonnier</b> sert aux activités qui reviennent chaque année à la même période.</div>
    </fieldset>
    ${fige
      ? `<div class="envoye">Fiche envoyée à Sophie le 30/11 à ${E.envoye}. Réponds-lui maintenant dans la <button type="button" class="lien" data-aller="mail">Messagerie</button>.</div>`
      : `<button class="btn btn-p" type="submit" style="margin-top:6px">Envoyer la fiche à Sophie</button>
         ${E.manque ? `<p class="manque" role="alert">${ech(E.manque)}</p>` : ''}`}
  </form>`;
}

function vueFiche() {
  const tete = `<h2>Fiche de sélection</h2><p class="note">Poste : cariste en CDD saisonnier, prise de poste le mercredi 9 décembre 2026.</p>`;
  if (V === 'A') {
    return `${tete}<p class="note">Pour relire un document : <button class="lien" data-aller="mail">Messagerie</button> → message de Sophie → pièces jointes.</p>
      <div style="max-width:760px">${formulaire()}</div>`;
  }
  const onglets = `<div class="onglets" role="tablist" aria-label="Documents">${DOCS.map((d) =>
    `<button role="tab" data-onglet="${d.id}" aria-selected="${E.docCote === d.id}">${ech(d.court)}</button>`).join('')}</div>`;
  return `${tete}<div class="cote" style="margin-top:12px">
      <div class="docs">${onglets}<div class="feuille">${DOC[E.docCote].html}</div></div>
      <div>${formulaire()}</div></div>`;
}

function vueBilan() {
  if (!E.envoye) return `<h2>Bilan</h2><section class="panneau"><p style="margin:0">Rien n'est jugé avant l'envoi de la fiche (dans la séance, le bilan apparaît à la fin, comme d'habitude).</p></section>`;
  const items = CANDIDATS.map((c, k) => {
    const a = attendu(c), t = E.tri[c.id] || {};
    const fausses = COLONNES.filter((col) => t[col.id] !== a[col.id]).map((col) => col.lib);
    return `<li>${k + 1}. Ligne de ${ech(c.nom)} : ${fausses.length ? `<span class="ko">à revoir</span> (${fausses.map(ech).join(', ')})` : '<span class="ok">juste</span>'}</li>`;
  });
  items.push(`<li>6. Candidat retenu : ${E.candidat === 'yanis' ? '<span class="ok">juste</span>' : '<span class="ko">à revoir</span>'}</li>`);
  items.push(`<li>7. Contrat : ${E.contrat === 'CDD' ? '<span class="ok">juste</span>' : '<span class="ko">à revoir</span>'}</li>`);
  items.push('<li class="note">8. et 9. Message à Sophie (raison, ton professionnel) : lus sur la réponse par phrases, non reprise ici.</li>');
  return `<h2>Bilan <span class="note">(aperçu pour l'essai)</span></h2>
    <section class="panneau bilan"><ol style="list-style:none; padding:0; margin:0">${items.join('')}</ol></section>`;
}

/* ---------------------------------------------------------------- dessin et événements */
const main = document.getElementById('main');
function dessiner() {
  const vues = { accueil: vueAccueil, mail: vueMail, fiche: vueFiche, bilan: vueBilan };
  main.innerHTML = vues[E.vue]();
  document.querySelectorAll('nav [data-vue]').forEach((b) => b.setAttribute('aria-current', b.dataset.vue === E.vue ? 'page' : 'false'));
  document.querySelector('[data-nonlus]').textContent = E.lu ? '' : '1';
  document.querySelector('[data-nonlus]').hidden = E.lu;
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  // bulles du lexique
  document.querySelectorAll('.bulle').forEach((b) => { b.parentElement.setAttribute('aria-expanded', 'false'); b.remove(); });
  if (!t) return;
  if (t.dataset.mot) {
    if (t.dataset.ouvert === '1') { t.dataset.ouvert = ''; return; }
    document.querySelectorAll('.mot').forEach((m) => { m.dataset.ouvert = ''; });
    const b = document.createElement('span'); b.className = 'bulle'; b.textContent = LEXIQUE[t.dataset.mot.toLowerCase()];
    t.appendChild(b); t.setAttribute('aria-expanded', 'true'); t.dataset.ouvert = '1'; return;
  }
  if (t.dataset.var) { V = t.dataset.var; document.querySelectorAll('[data-var]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.var === V)); dessiner(); return; }
  if (t.hasAttribute('data-reset')) { initial(); dessiner(); return; }
  if (t.dataset.vue) { E.vue = t.dataset.vue; E.doc = null; dessiner(); return; }
  if (t.dataset.aller) { E.vue = t.dataset.aller; E.doc = null; if (E.vue === 'mail') { E.mailSel = 1; E.lu = true; } dessiner(); return; }
  if (t.hasAttribute('data-ouvrir-mail')) { E.mailSel = 1; E.lu = true; E.doc = null; dessiner(); return; }
  if (t.dataset.pj) { E.doc = t.dataset.pj; E.vus[t.dataset.pj] = true; dessiner(); main.scrollIntoView(); return; }
  if (t.hasAttribute('data-retour-mail')) { E.doc = null; dessiner(); return; }
  if (t.dataset.onglet) { E.docCote = t.dataset.onglet; E.vus[t.dataset.onglet] = true; dessiner(); document.querySelector(`[data-onglet="${E.docCote}"]`).focus({ focusVisible: false }); return; }
  if (t.dataset.tri) {
    const [c, col, v] = t.dataset.tri.split('|');
    E.tri[c] = E.tri[c] || {}; E.tri[c][col] = v === '1';
    // pas de redessin : on garde le focus et la place dans la page
    t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === t));
    return;
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'cand') E.candidat = ev.target.value;
  if (ev.target.name === 'contrat') E.contrat = ev.target.value;
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const vides = CANDIDATS.reduce((n, c) => n + COLONNES.filter((col) => (E.tri[c.id] || {})[col.id] === undefined).length, 0);
  const manque = [];
  if (vides) manque.push(`${vides} case${vides > 1 ? 's' : ''} du tableau sans réponse`);
  if (!E.candidat) manque.push('le candidat');
  if (!E.contrat) manque.push('le contrat');
  if (manque.length) { E.manque = 'Il manque : ' + manque.join(', ') + '.'; dessiner(); return; }
  const d = new Date(); E.envoye = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); E.manque = '';
  dessiner();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') document.querySelectorAll('.bulle').forEach((b) => b.remove()); });
dessiner();
</script>
</body>
</html>
