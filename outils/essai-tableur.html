<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — geste tableur (Prepalog)</title>
<!-- Page d'ESSAI du geste tableur « Exporter, traiter, Déposer » (04/10/2026, chantier C5), dans le
     vrai moteur d'entreprise, sur une mini-séance Cdiscount de dix lignes (outils/essai-tableur.js).
     Ce qu'on y essaie : 1. Commandes → « Exporter les lignes de préparation » ; 2. dans Excel OU
     LibreOffice, colonne « Écart », colonne « Réf. en écart » (SI), « Nb constats » (NB.SI) dans la
     feuille Synthèse ; 3. menu Fichiers → déposer le classeur. Le sélecteur choisit le retour :
     guidage (détaillé), entraînement (« n sur m »), évaluation (« Fichier reçu », un seul dépôt).
     Rien n'est enregistré : la base vit en mémoire, « Recommencer » repart de zéro.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-tableur.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/inventaire.css">
<link rel="stylesheet" href="./styles/plan.css">
<link rel="stylesheet" href="./styles/grille.css">
<link rel="stylesheet" href="./styles/quiz.css">
<link rel="stylesheet" href="./styles/carte.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:8px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 16px 2px 0; white-space:nowrap; font-weight:400 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-reglages button{ width:auto; padding:2px 10px }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Essai du geste tableur</b> — Commandes → Exporter ; Fichiers → Déposer.
  <label>Retour au dépôt <select name="retour">
    <option value="guidage">guidage : détaillé, case par case</option>
    <option value="entrainement">entraînement : « n résultats justes sur m »</option>
    <option value="evaluation">évaluation : « Fichier reçu », un seul dépôt</option>
  </select></label>
  <button type="button" id="recommencer">Recommencer</button>
</form>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { univers } from './outils/essai-tableur.js';
const form = document.getElementById('reglages');
function monter() {
  const retour = new FormData(form).get('retour');
  const db = {};
  const hote = document.getElementById('hote');
  hote.innerHTML = '';
  creerEntreprise(univers(retour)).rendre(hote, {
    meta: { id: 'essai-tableur', code: 'ESSAI', titre: 'Cdiscount — essai du geste tableur', portee: 'eleve', immersif: true, temps: retour },
    profil: { prenom: 'Essai', nom: 'Tableur', role: 'eleve' },
    jeu: { etat: () => db, sauver: () => {} },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'STOCK24',
  });
  window.__essai = { db };
}
form.addEventListener('change', monter);
document.getElementById('recommencer').addEventListener('click', monter);
monter();
</script>
</body>
</html>
