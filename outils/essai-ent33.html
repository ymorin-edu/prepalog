<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — ENT-3.3 en deux temps (Prepalog)</title>
<!-- Page d'ESSAI d'ENT-3.3 en deux temps (brief docs/briefs/ENT-3.3-deux-temps.md), pour l'essai de
     Tristan à l'écran : c'est la VRAIE séance (`activites/boost-ent33.js`), vue par un élève. La base est
     gardée dans l'onglet (sessionStorage) ; « Recommencer l'essai » repart de zéro. Liée nulle part.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-ent33.html
     Le suivi (les sept jalons) s'affiche sous la séance, comme le verrait l'enseignant. -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<style>
  #essai{ max-width:1100px; margin:12px auto; display:flex; flex-wrap:wrap; gap:8px; font-size:14px }
  #suivi{ max-width:1100px; margin:24px auto; padding:12px 16px; border:1px dashed var(--filet); border-radius:8px; font-size:14px }
  #suivi h2{ font-size:15px; margin:0 0 8px }
  #suivi li{ margin:3px 0; white-space:pre-line }
</style>
</head>
<body>
<div id="essai">
  <button class="btn btn-s" id="raccourci" title="Envoie à Inès une réponse juste, comme l’élève le ferait depuis la messagerie">Raccourci : envoyer la réponse à Inès</button>
  <button class="btn btn-s" id="zero">Recommencer l’essai</button>
</div>
<div id="hote"></div>
<section id="suivi" aria-live="polite"><h2>Suivi enseignant (essai)</h2><ul></ul></section>
<script type="module">
import * as act from './activites/boost-ent33.js';
import * as S from './contenus/boost-ent33.js';

const CLE = 'essai-ent33';
const db = (() => { try { return JSON.parse(sessionStorage.getItem(CLE)) || {}; } catch (e) { return {}; } })();
const garder = () => { try { sessionStorage.setItem(CLE, JSON.stringify(db)); } catch (e) { /* onglet privé */ } };
document.getElementById('zero').addEventListener('click', () => { sessionStorage.removeItem(CLE); location.reload(); });

const suivi = document.querySelector('#suivi ul');
const signe = { ok: '✓', ko: '✗', attente: '…', na: '·' };
const montrer = (r) => {
  const t = db.transport && db.transport[S.TRANSPORT_ID] && db.transport[S.TRANSPORT_ID].tournee;
  suivi.innerHTML = (r ? `<li><strong>${r.score} / ${r.max} jalons</strong></li>` : '')
    + `<li>Temps : ${t && t.phase ? '2 — corriger' : '1 — contrôler (figé)'}${t && t.termine
      ? ` · « J’ai terminé » à ${new Date(t.termine).toLocaleTimeString('fr-FR')}` : ''}</li>`
    + S.ETAPES.map((e) => { const v = e.verifier(db) || {};
      return `<li>${signe[v.status] || '·'} ${e.titre}${v.detail ? ' — ' + v.detail : ''}</li>`; }).join('');
};
act.rendre(document.getElementById('hote'), {
  meta: act.meta,
  profil: { prenom: 'Essai', nom: 'Élève', role: 'eleve' },
  jeu: { etat: () => db, sauver: () => { garder(); montrer(); } },
  enregistrer: (r) => { garder(); montrer(r); },
  quitter: () => { location.reload(); }, codeStock: '',
});
montrer();
window.__essai = { db };

// Le raccourci : la réponse juste, rangée comme le fait « Envoyer », puis la séance est remontée pour
// que le message d'Inès arrive comme après un vrai envoi.
document.getElementById('raccourci').addEventListener('click', () => {
  db.mails = db.mails || [];
  if (!db.mails.some((m) => m.folder === 'out' && m.toMail === S.INES.mail)) {
    db.mails.push({ id: 'essai-' + Date.now(), folder: 'out', ts: Date.now(), from: 'Essai', to: S.INES.nom,
      toMail: S.INES.mail, subject: 'Re : ta tournée', kind: 'text', text: S.reponseAttendue(), read: true });
  }
  garder();
  location.reload();
});
</script>
</body>
</html>
