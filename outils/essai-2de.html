<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — 2de (Prepalog)</title>
<!-- Page d'ESSAI des briques de la 2de (brief `docs/briefs/MOTEUR-2de-S1.md`), dans le vrai moteur
     d'entreprise (univers `outils/essai-2de.js`). Elle n'est liée nulle part et rien n'y est
     enregistré : la base vit en mémoire, un changement de réglage repart de zéro.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-2de.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:8px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 16px 2px 0; white-space:nowrap; font-weight:400; color:#3b3200 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-note{ background:#fff7d6; border:1px solid #e8d48a; color:#3b3200; padding:8px 16px; font:14px/1.5 sans-serif }
  .essai-mention{ font:12.5px/1.5 sans-serif; color:#3b3200; background:#fffbea; padding:4px 16px; border-bottom:1px solid #e8d48a }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai</b> — chaque changement repart d'une base neuve :
  <label>Prénom de l'élève <select name="prenom"><option>Lea</option><option>Noah</option><option>Jade</option></select></label>
  <label>Voir comme <select name="role"><option value="eleve">élève</option><option value="prof">enseignant</option></select></label>
  <button type="button" id="bilan">Ce que lit le jalon</button>
</form>
<div class="essai-mention" id="mention"></div>
<div id="essaiNote" class="essai-note" hidden></div>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { univers, MENTION, PHRASES_SOPHIE } from './outils/essai-2de.js';
import { phrasesJustes } from './core/phrases.js';

document.getElementById('mention').innerHTML = MENTION;
const form = document.getElementById('reglages');
const boite = document.getElementById('essaiNote');
let db = {};
function monter() {
  const f = new FormData(form);
  const hote = document.getElementById('hote');
  const neuf = hote.cloneNode(false); hote.replaceWith(neuf);
  boite.hidden = true;
  db = {};
  const moteur = creerEntreprise(univers({}));
  moteur.rendre(neuf, {
    meta: { id: 'essai-2de', code: 'ESSAI', titre: 'Essai 2de', portee: 'eleve', immersif: true, temps: 'guidage' },
    // L'ordre des phrases est tiré sur l'identifiant de l'élève : changer de prénom le change.
    profil: { prenom: f.get('prenom'), nom: 'Essai', role: f.get('role'), uid: 'essai-' + f.get('prenom') },
    jeu: { etat: () => db, sauver: () => {} },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'ESSAI',
    lireScore: async () => null,
    rendreCopie: async () => ({ rendu: Date.now() }),
  });
  window.__essai = { db, moteur };
  document.querySelector('.ent-nav[data-vue="mail"]')?.click();
}
document.getElementById('bilan').addEventListener('click', () => {
  const r = phrasesJustes(db, PHRASES_SOPHIE.id);
  boite.hidden = false;
  boite.innerHTML = `<b>Ce que lit le jalon</b> (l'élève ne le voit qu'au bilan) : ${r.envoye ? `${r.envois} envoi(s)` : 'rien d’envoyé'} ·
    justes : ${r.justes.join(', ') || '—'} · fausses : ${r.faux.join(', ') || '—'} · juste du premier coup : ${r.premierCoup ? 'oui' : 'non'}`;
});
form.addEventListener('change', monter);
monter();
</script>
</body>
</html>
