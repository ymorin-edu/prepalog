<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — questions au fil (Prepalog)</title>
<!-- Page d'ESSAI des questions au fil (brief `docs/briefs/MOTEUR-questions-au-fil.md`, lot 2), dans le vrai moteur
     d'entreprise (séance d'essai `contenus/questions-essai.js`, questions `contenus/questions/ESSAI.js`). Elle n'est
     liée nulle part. La base est gardée dans ce navigateur (localStorage) : on peut modifier `contenus/questions/ESSAI.js`,
     recharger, et retrouver ses réponses. Un changement de réglage, ou « Repartir de zéro », repart d'une base neuve.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-questions.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/questions.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:8px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 16px 2px 0; white-space:nowrap; font-weight:400; color:#3b3200 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-mention{ font:12.5px/1.5 sans-serif; color:#3b3200; background:#fffbea; padding:4px 16px; border-bottom:1px solid #e8d48a }
  .essai-note{ background:#fff7d6; border:1px solid #e8d48a; color:#3b3200; padding:8px 16px; font:14px/1.5 sans-serif; white-space:pre-wrap }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai</b> — la base est gardée au rechargement ; un changement de réglage repart de zéro :
  <label>Voir comme <select name="role"><option value="eleve">élève</option><option value="prof">enseignant</option></select></label>
  <label>Séance <select name="temps"><option value="guidage">entraînement</option><option value="evaluation">évaluation (copie)</option></select></label>
  <button type="button" id="note">Ce que lit la note</button>
  <button type="button" id="zero">Repartir de zéro</button>
</form>
<div class="essai-mention" id="mention"></div>
<div id="essaiNote" class="essai-note" hidden></div>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { univers, MENTION, META } from './contenus/questions-essai.js';

document.getElementById('mention').innerHTML = MENTION;
const form = document.getElementById('reglages');
const boite = document.getElementById('essaiNote');
const CLE = 'essai-questions-base';
let db = {}, moteur = null;
const lire = () => { try { return JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) { return null; } };
const garder = () => { try { localStorage.setItem(CLE, JSON.stringify({ reglages: Object.fromEntries(new FormData(form)), db })); } catch (e) { /* rien */ } };
// Au chargement : les réglages et la base d'avant, s'il y en a.
const avant = lire();
if (avant && avant.reglages) Object.entries(avant.reglages).forEach(([k, v]) => { if (form[k]) form[k].value = v; });
function monter(garderBase) {
  const f = new FormData(form);
  const hote = document.getElementById('hote');
  const neuf = hote.cloneNode(false); hote.replaceWith(neuf);
  boite.hidden = true;
  db = garderBase && avant && avant.db ? avant.db : {};
  const copie = f.get('temps') === 'evaluation';
  moteur = creerEntreprise(univers({ copie }));
  moteur.rendre(neuf, {
    meta: { ...META, ...(copie ? { copie: true, temps: 'evaluation' } : {}) },
    profil: { prenom: 'Lea', nom: 'Essai', role: f.get('role'), uid: 'essai-lea' },
    jeu: { etat: () => db, sauver: garder },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'ESSAI',
    lireScore: async () => null,
    rendreCopie: async () => ({ rendu: Date.now() }),
  });
  window.__essai = { db, moteur };
}
document.getElementById('note').addEventListener('click', () => {
  const n = moteur.noter(db);
  boite.hidden = false;
  boite.textContent = `Note : ${n.score} sur ${n.max}\n` + Object.entries(n.detail).filter(([, v]) => typeof v === 'string')
    .map(([k, v]) => `${k} : ${v}`).join('\n') + `\nRéponses rangées : ${JSON.stringify((db.questions || {})['essai-questions'] || {})}`;
});
form.addEventListener('change', () => { monter(false); garder(); });
document.getElementById('zero').addEventListener('click', () => { try { localStorage.removeItem(CLE); } catch (e) { /* rien */ } location.reload(); });
monter(true);
</script>
</body>
</html>
