<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — Animation à questions (Prepalog)</title>
<!-- Page d'ESSAI de l'écran `core/types/animation.js` (brief docs/briefs/MOTEUR-vue-animation.md), sur le
     contenu d'essai `contenus/animation-essai.js` = la maquette d'ENT-6.5 rejouée par la vue. Elle n'est liée
     nulle part. La base vit en mémoire, ou dans ce navigateur si « Garder mes réponses » est coché.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-animation.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/animation.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:6px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 14px 2px 0; white-space:nowrap; font-weight:400; color:#3b3200 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-reglages input[type=checkbox]{ width:auto; display:inline-block }
  .essai-reglages a{ color:#3b3200 }
  .essai-mention{ font:12.5px/1.5 sans-serif; color:#3b3200; background:#fffbea; padding:3px 16px; border-bottom:1px solid #e8d48a }
  .essai-mention b{ font-weight:700 }
  #hote.seule{ max-width:1180px; margin:10px auto; padding:0 12px }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai</b> —
  <label>Où <select name="ou"><option value="simulog">dans une séance Simulog</option><option value="seule">hors Simulog (activité Prepalog)</option></select></label>
  <label>Voir comme <select name="role"><option value="eleve">élève</option><option value="prof">enseignant</option></select></label>
  <label>Vitesse <select name="vitesse"><option value="">celle du contenu (0,8)</option><option value="4">× 5 (essai rapide)</option></select></label>
  <label><input type="checkbox" name="garder"> Garder mes réponses (recharger = les retrouver)</label>
  <button type="button" id="effacer">Effacer mes réponses</button>
  · <a href="./docs/briefs/france-boissons/animation-6.5-couloir-2temps.html" target="_blank" rel="noopener">Ouvrir la maquette (autre onglet)</a>
</form>
<div class="essai-mention" id="mention"></div>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { creerAnimation, etapesAnimation } from './core/types/animation.js';
import { univers } from './outils/essai-animation.js';
import { ANIMATION_ESSAI, MENTION } from './contenus/animation-essai.js';

const CLE = 'essai-animation-base';
const form = document.getElementById('reglages');
const mention = document.getElementById('mention');
// Les réglages survivent au rechargement (essai « recharger → mêmes places des choix »).
try { const r = JSON.parse(localStorage.getItem(CLE + '-reglages') || '{}'); Object.entries(r).forEach(([k, v]) => { const el = form.elements[k]; if (!el) return; if (el.type === 'checkbox') el.checked = v; else el.value = v; }); } catch (e) { /* rien */ }

let db = {};
function jalons(A) {
  const L = etapesAnimation(A).map((e, i) => {
    const s = e.verifier(db).status;
    return `Jalon ${i + 1} : <b>${s === 'ok' ? 'franchi' : s === 'ko' ? 'non franchi (1re réponse fausse)' : 'à faire'}</b>`;
  });
  mention.innerHTML = `${MENTION}<br>${L.join(' · ')}`;
}
function monter() {
  const f = new FormData(form);
  const garder = !!form.elements.garder.checked;
  try { localStorage.setItem(CLE + '-reglages', JSON.stringify({ ou: f.get('ou'), role: f.get('role'), vitesse: f.get('vitesse'), garder })); } catch (e) { /* rien */ }
  db = {};
  if (garder) { try { db = JSON.parse(localStorage.getItem(CLE) || '{}'); } catch (e) { db = {}; } }
  const A = f.get('vitesse') ? Object.assign({}, ANIMATION_ESSAI, { vitesse: Number(f.get('vitesse')) }) : ANIMATION_ESSAI;
  const sauver = () => { if (garder) { try { localStorage.setItem(CLE, JSON.stringify(db)); } catch (e) { /* rien */ } } jalons(A); };
  const hote = document.getElementById('hote');
  const neuf = hote.cloneNode(false); hote.replaceWith(neuf);
  const ctx = {
    meta: { id: 'essai-animation', code: 'ESSAI', titre: 'Essai de l’animation', portee: 'eleve', immersif: true, temps: 'guidage', bareme: 2 },
    profil: { prenom: 'Essai', nom: 'Animation', role: f.get('role'), uid: 'essai-eleve' },
    jeu: { etat: () => db, sauver },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'ESSAI', lireScore: async () => null,
  };
  if (f.get('ou') === 'seule') {
    neuf.className = 'seule';
    creerAnimation(A).rendre(neuf, ctx);
  } else {
    creerEntreprise(univers({ animation: A })).rendre(neuf, ctx);
    neuf.querySelector('.ent-nav[data-vue^="animation:"]')?.click();
  }
  jalons(A);
  window.__essai = { db: () => db };
}
form.addEventListener('change', monter);
document.getElementById('effacer').addEventListener('click', () => { try { localStorage.removeItem(CLE); } catch (e) { /* rien */ } monter(); });
monter();
</script>
</body>
</html>
