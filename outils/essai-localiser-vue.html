<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — vue Localiser (Prepalog)</title>
<!-- Page d'ESSAI de la vue « Localiser » (brief `docs/briefs/MOTEUR-vue-localiser.md`, lots 2 et 3), dans le vrai moteur
     d'entreprise, sur le contenu d'essai `contenus/localiser-essai.js` (jeu Action : lieux éloignés, trajet fléché ; jeu
     France Boissons : lieux proches, encart). Elle n'est liée nulle part. La base est gardée dans ce navigateur (localStorage) :
     on peut recharger et retrouver où on en était. Un changement de réglage, ou « Repartir de zéro », repart d'une base neuve.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-localiser-vue.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/questions.css">
<link rel="stylesheet" href="./styles/localiser.css">
<style>
  .essai-reglages{ background:var(--gele-fond); border-bottom:1px solid var(--filet); padding:6px 16px; font:14px/1.5 sans-serif; color:var(--encre) }
  .essai-reglages label{ display:inline-block; margin:2px 14px 2px 0; white-space:nowrap; font-weight:400 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-note{ background:var(--gele-fond); border:1px solid var(--filet); padding:8px 16px; font:14px/1.5 sans-serif; white-space:pre-wrap }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai</b> — vue « Localiser » :
  <label>Jeu <select name="jeu"><option value="action">Action (lieux éloignés)</option><option value="proche">France Boissons (lieux proches)</option></select></label>
  <label>Niveau <select name="aisance"><option value="standard">standard</option><option value="accompagne">accompagné</option><option value="confirme">confirmé</option></select></label>
  <label>Voir comme <select name="role"><option value="eleve">élève</option><option value="prof">enseignant</option></select></label>
  <label>Question <select name="question"><option value="">aucune</option><option value="dep2">après le département du 2e lieu</option></select></label>
  <label>Thème <select name="theme"><option value="">du poste</option><option value="clair">clair</option><option value="sombre">sombre</option></select></label>
  <button type="button" id="note">Ce que lit la note</button>
  <button type="button" id="zero">Repartir de zéro</button>
</form>
<div id="essaiNote" class="essai-note" hidden></div>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { etapesLocaliser } from './core/types/localiser.js';
import { apresGeste } from './core/declencheurs.js';
import * as B from './contenus/boost.js';
import { LOCALISER_ACTION, LOCALISER_PROCHE } from './contenus/localiser-essai.js';

const form = document.getElementById('reglages');
const boite = document.getElementById('essaiNote');
const CLE = 'essai-localiser-base';
const SEANCE = 'essai-localiser';
let db = {}, moteur = null;
const lire = () => { try { return JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) { return null; } };
const garder = () => { try { localStorage.setItem(CLE, JSON.stringify({ reglages: Object.fromEntries(new FormData(form)), db })); } catch (e) { /* rien */ } };
const avant = lire();
if (avant && avant.reglages) Object.entries(avant.reglages).forEach(([k, v]) => { if (form[k]) form[k].value = v; });
function monter(garderBase) {
  const f = new FormData(form);
  if (f.get('theme')) document.documentElement.dataset.theme = f.get('theme'); else delete document.documentElement.dataset.theme;
  const L = f.get('jeu') === 'proche' ? LOCALISER_PROCHE : LOCALISER_ACTION;
  const poids = [3, 3, 3, 3, 4, 4];
  const etapes = etapesLocaliser(L, SEANCE).map((j) => (j.bonus ? j : Object.assign(j, { poids: poids.shift(), groupe: 'La carte' })));
  const hote = document.getElementById('hote');
  const neuf = hote.cloneNode(false); hote.replaceWith(neuf);
  boite.hidden = true;
  db = garderBase && avant && avant.db ? avant.db : {};
  const U = { ENTREPRISE: B.ENTREPRISE, VOCAB: B.VOCAB, CATALOGUE: B.CATALOGUE, SUPPLIERS: B.SUPPLIERS, SUP_BY_ID: B.SUP_BY_ID,
    CUSTOMERS: B.CUSTOMERS, CM: B.CM, baseDeDepart: B.baseDeDepart, THEME: {}, menu: [], etapes, exercice: 'Essai de la carte', localiser: L };
  if (f.get('question')) {
    const lieu = L.lieux[1].id;
    U.questions = { id: SEANCE, personnes: { Samia: { nom: 'Samia (essai)', role: 'cheffe d’équipe' } },
      liste: [{ id: 'pourquoi-ici', type: 'fil', de: 'Samia', quand: apresGeste(`localiser:${lieu}:departement`), reflexion: true,
        enonce: 'Pourquoi ce lieu-là, à ton avis ?', choix: [{ v: 'a', lib: 'Près de ceux qu’il sert' }, { v: 'b', lib: 'Au hasard' }],
        retour: 'Un entrepôt se pose près des magasins qu’il livre, et près des grandes routes.' }] };
  }
  moteur = creerEntreprise(U);
  moteur.rendre(neuf, {
    meta: { id: SEANCE, code: 'ESSAI', titre: 'Carte de France — essai', portee: 'eleve', immersif: true, niveauxPrevus: ['confirme'] },
    profil: { prenom: 'Lea', nom: 'Essai', role: f.get('role'), uid: 'essai-lea' }, aisance: f.get('aisance'),
    jeu: { etat: () => db, sauver: garder },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'ESSAI', lireScore: async () => null,
  });
  neuf.querySelector('.ent-nav[data-vue="localiser"]')?.click();
  window.__essai = { db, moteur };
}
document.getElementById('note').addEventListener('click', () => {
  const n = moteur.noter(db);
  boite.hidden = false;
  boite.textContent = `Note : ${n.score} sur ${n.max}\n` + Object.entries(n.detail).filter(([, v]) => typeof v === 'string')
    .map(([k, v]) => `${k} : ${v}`).join('\n') + (n.detail.bonus ? `\nbonus : ${JSON.stringify(n.detail.bonus)}` : '')
    + `\nErreurs (repérage) : ${JSON.stringify(((db.indicateurs || {})[SEANCE] || {}).localiser || {})}`;
});
form.addEventListener('change', () => { monter(false); garder(); });
document.getElementById('zero').addEventListener('click', () => { try { localStorage.removeItem(CLE); } catch (e) { /* rien */ } location.reload(); });
monter(true);
</script>
</body>
</html>
