<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — vue carte réelle (Prepalog)</title>
<!-- Page d'ESSAI de la vue `core/types/carte.js`, dans le vrai moteur d'entreprise et le décor
     Boost, AVANT qu'ENT-3.2 existe comme séance. Elle n'est liée nulle part et rien n'y est
     enregistré : la base vit en mémoire, un rechargement repart de zéro.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-carte.html -->
<!-- Les chemins du contenu (logo, trames) partent de la racine du site : on s'y place. -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
</head>
<body>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import * as BOOST from './contenus/boost.js';
// La journée d'ENT-3.2 (étape 2b) : huit clients, la Cave Teissier trop lourde, un créneau.
import { CARTE } from './contenus/boost-ent32-carte.js';

const moteur = creerEntreprise({
  ENTREPRISE: BOOST.ENTREPRISE, VOCAB: BOOST.VOCAB, CATALOGUE: BOOST.CATALOGUE,
  SUPPLIERS: BOOST.SUPPLIERS, SUP_BY_ID: BOOST.SUP_BY_ID, CUSTOMERS: BOOST.CUSTOMERS, CM: BOOST.CM,
  baseDeDepart: BOOST.baseDeDepart, THEME: BOOST.THEME,
  etapes: [], exercice: 'Essai de la carte réelle',
  transportSection: 'Tournées', transportId: 'essai-carte',
  plan: {
    libelle: 'Plan de Nîmes',
    titre: 'Situer les nouveaux clients sur le plan de Nîmes',
    consigne: 'Les clients habituels sont déjà sur la carte. Situez les quatre nouveaux : '
      + 'cherchez leur rue dans l’index, ouvrez le quartier, puis cliquez sur la rue.',
    carte: CARTE,
  },
  // La tournée sur la carte réelle (étape 2) : le minimum pour l'essayer, sans feuille de calcul.
  tournee: {
    libelle: 'Tournée (essai)', titre: 'Organiser la tournée sur la carte réelle',
    consigne: 'Départ de l’entrepôt à 14 h 10, train à 16 h 10, 180 kg au plus. La Pâtisserie Arnaud '
      + 'doit être livrée avant 14 h 45 : la colonne de droite dit si le créneau est tenu. Cliquez l’entrepôt, puis les clients dans l’ordre de passage, '
      + 'puis la gare. Le tracé suit les rues ; les kilomètres sont ceux de l’itinéraire à vélo-cargo.',
    mesures: [{ id: 'charge', libelle: 'Charge', unite: 'kg', champ: 'kg', max: BOOST.VELO.chargeUtile },
      { id: 'colis', libelle: 'Colis', unite: 'colis', champ: 'colis' }],
    horaire: { depart: 14 * 60 + 10, limite: BOOST.VELO.train, vitesse: BOOST.VELO.vitesse,
      service: BOOST.VELO.service, libelleLimite: 'départ du train' },
    departAQuai: true, extremitesACliquer: true,
    libelleCharge: 'Chargé dans le vélo-cargo', libelleQuai: 'Commandes restées à quai', libelleCharger: 'charger',
  },
});
const db = {};
moteur.rendre(document.getElementById('hote'), {
  meta: { id: 'essai-carte', code: 'ESSAI', titre: 'Boost — essai de la carte réelle', portee: 'eleve', immersif: true, jeuId: 'essai-carte' },
  profil: { prenom: 'Essai', nom: 'Carte', role: 'eleve' },
  jeu: { etat: () => db, sauver: () => {} },
  enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: '',
});
window.__essai = { db };
document.querySelector('.ent-nav[data-vue="plan"]')?.click();
</script>
</body>
</html>
