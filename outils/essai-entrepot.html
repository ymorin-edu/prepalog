<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — Plan d'entrepôt (Prepalog)</title>
<!-- Page d'ESSAI de l'écran `core/types/entrepot.js`, dans le vrai moteur d'entreprise, sur les cas
     « rangement », « préparation » (maquette v2), « visite » (ENT-5.3), masse (ENT-6.5, 6.6) et allée de picking (ENT-6.7) — `contenus/entrepot-essai.js`. Elle n'est liée nulle part et rien
     n'y est enregistré : la base vit en mémoire, un changement de réglage repart de zéro.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-entrepot.html -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/inventaire.css">
<link rel="stylesheet" href="./styles/plan.css">
<link rel="stylesheet" href="./styles/grille.css">
<link rel="stylesheet" href="./styles/quiz.css">
<link rel="stylesheet" href="./styles/carte.css">
<link rel="stylesheet" href="./styles/entrepot.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:8px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 16px 2px 0; white-space:nowrap; font-weight:400; color:#3b3200 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-note{ background:#fff7d6; border:1px solid #e8d48a; color:#3b3200; padding:8px 16px; font:14px/1.5 sans-serif }
  .essai-mention{ font:12.5px/1.5 sans-serif; color:#3b3200; background:#fffbea; padding:4px 16px; border-bottom:1px solid #e8d48a }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai</b> — chaque changement repart d'une base neuve :
  <label>Cas <select name="cas"><option value="rangement">① Rangement (ENT-5.5)</option><option value="preparation">③ Préparation (ENT-5.6)</option><option value="visite">Visite (ENT-5.3)</option><option value="masse">Stockage de masse (ENT-6.5)</option><option value="comptage">Masse, comptage (ENT-6.6)</option><option value="picking">Allée de picking (ENT-6.7)</option><option value="vocal">Préparation vocale, cartons (Action, E-8)</option><option value="vocal-ex">Préparation vocale, abîmé et vide (Action, E-8)</option><option value="vocal-deux">Préparation vocale, deux magasins (Action, E-8)</option><option value="vocal-eval">Préparation vocale, évaluation dans un autre site (Action, E-8)</option></select></label>
  <label>Temps <select name="temps"><option value="guidage">guidage</option><option value="entrainement">entraînement</option><option value="evaluation">évaluation (copie rendue)</option></select></label>
  <label>Voir comme <select name="role"><option value="eleve">élève</option><option value="prof">enseignant (bonnes réponses, visite : navigation libre)</option></select></label>
</form>
<div class="essai-mention" id="mention"></div>
<div id="essaiNote" class="essai-note" hidden></div>
<div id="hote"></div>
<script type="module">
import { creerEntreprise } from './core/types/entreprise.js';
import { univers } from './outils/essai-entrepot.js';
import { MENTION } from './contenus/entrepot-essai.js';
import { MENTION as MENTION_MASSE, MENTION_COMPTAGE } from './contenus/entrepot-masse-essai.js';
import { MENTION as MENTION_PICKING } from './contenus/entrepot-picking-essai.js';
import { preparation, MENTION_PREPA } from './contenus/action-prepa-donnees.js';
import { universPalettier } from './contenus/palettier-essai.js';
import { etapesEntrepot } from './core/types/entrepot.js';
// La préparation vocale d'Action (chantier E-8) : une commande tirée par élève ; ici, l'élève témoin (graine « temoin-1 »).
const VOCAL = preparation({ id: 'essai-vocal', lignes: 5, terminal: { montrer: 'travee' },
  personnage: { nom: 'Kevin', role: 'chef d’équipe', date: '6 h 00', texte: 'Tu prépares la commande du magasin. Le terminal te guide : écoute-le, va à l’emplacement, lis le code sur l’étiquette.' } });
// Lot 3 : sept lignes, un carton abîmé devant une pile, un emplacement vide (le profil d'ENT-8.16).
// Lot 4 : deux magasins, deux palettes, huit lignes et un abîmé (le profil d'ENT-8.18).
const VOCAL_DEUX = preparation({ id: 'essai-vocal-deux', lignes: 8, magasins: 2, abimes: 1, terminal: {},
  personnage: { nom: 'Kevin', role: 'chef d’équipe', date: '6 h 00', texte: 'Deux magasins ce matin, deux palettes. Le terminal te dit pour qui à chaque ligne.' } });
const VOCAL_EX = preparation({ id: 'essai-vocal-ex', lignes: 7, abimes: 1, vides: 1, terminal: {},
  personnage: { nom: 'Kevin', role: 'chef d’équipe', date: '6 h 00', texte: 'Regarde bien de près : un carton abîmé ne part pas au magasin. S’il n’y a rien, dis-le au terminal : je descends la réserve.' } });
// Lot 5 : l'évaluation (copie) dans un AUTRE site (autre stock, ses magasins ; noms génériques ici), le profil d'ENT-8.19, montage jugé sur
// ce qui est posé.
const VOCAL_EVAL = preparation({ id: 'essai-vocal-eval', lignes: 7, fragiles: 1, abimes: 1, vides: 1, ordre: 'piege', terminal: { montageSurPose: true, cariste: 'Léo' },
  site: { cle: 'essai', magasins: [{ id: 'magasin-1', nom: 'Magasin de la région n° 1', court: 'Magasin 1' }, { id: 'magasin-2', nom: 'Magasin de la région n° 2', court: 'Magasin 2' }] },
  personnage: { nom: 'Léo', role: 'cariste', date: '6 h 00', texte: 'Le terminal te guide. Moi, je descends la réserve si tu me le demandes.' } });
// `?sansRendu` : la même avec `rendCopie: false` (« Valider » fige sans rendre la copie ; la séance la rend par le bandeau).
const VOCAL_EVAL_S = new URLSearchParams(location.search).has('sansRendu') ? (g, x) => Object.assign(VOCAL_EVAL(g, x), { rendCopie: false }) : VOCAL_EVAL;

document.getElementById('mention').innerHTML = MENTION;
const form = document.getElementById('reglages');
const boite = document.getElementById('essaiNote');
function monter() {
  const f = new FormData(form);
  // La visite est un guidage : pas d'évaluation (brief MOTEUR-modes-visite §6).
  // L'allée de picking (ENT-6.7) est un entraînement, sans évaluation pour l'instant.
  if (['visite', 'comptage'].includes(f.get('cas'))) form.temps.value = 'guidage';
  if (['picking', 'vocal', 'vocal-ex', 'vocal-deux'].includes(f.get('cas')) && form.temps.value === 'evaluation') form.temps.value = 'entrainement';
  if (f.get('cas') === 'vocal-eval') form.temps.value = 'evaluation';
  const temps = ['visite', 'comptage'].includes(f.get('cas')) ? 'guidage' : form.temps.value;
  document.getElementById('mention').innerHTML = f.get('cas') === 'masse' ? MENTION_MASSE : f.get('cas') === 'comptage' ? MENTION_COMPTAGE
    : f.get('cas') === 'picking' ? MENTION_PICKING : f.get('cas').startsWith('vocal') ? MENTION_PREPA : MENTION;
  const hote = document.getElementById('hote');
  const neuf = hote.cloneNode(false); hote.replaceWith(neuf);
  boite.hidden = true;
  const VX = { 'vocal-ex': VOCAL_EX, 'vocal-deux': VOCAL_DEUX, 'vocal-eval': VOCAL_EVAL_S }[f.get('cas')] || VOCAL;
  const U = f.get('cas').startsWith('vocal')
    ? Object.assign(universPalettier({ poids: false }), { entrepot: VX, copie: temps === 'evaluation', etapes: etapesEntrepot(VX, { copie: temps === 'evaluation' }),
      ENTREPRISE: { id: 'essai-entrepot', nom: 'Action — essai de la préparation vocale', sousTitre: f.get('cas') === 'vocal-eval' ? 'Un autre entrepôt (essai) — préparation' : 'Entrepôt d’Ensuès-la-Redonne (13) — préparation', exercice: 'Essai de la préparation vocale' } })
    : univers({ cas: f.get('cas'), temps });
  const moteur = creerEntreprise(U);
  const db = {};
  moteur.rendre(neuf, {
    meta: { id: 'essai-entrepot', code: 'ESSAI', titre: 'Essai du plan d’entrepôt', portee: 'eleve', immersif: true, temps, copie: temps === 'evaluation' },
    profil: { prenom: 'Essai', nom: 'Entrepôt', role: f.get('role'), uid: 'temoin-1' },
    jeu: { etat: () => db, sauver: () => {} },
    enregistrer: () => {}, quitter: () => { location.reload(); }, codeStock: 'ESSAI',
    lireScore: async () => null,
    // La remise de la copie, simulée : la note calculée s'affiche en haut (ce que l'enseignant lira).
    rendreCopie: async (res) => {
      const J = (res.detail && res.detail.entrepot && res.detail.entrepot.jalons) || [];
      boite.hidden = false;
      boite.innerHTML = `<b>Copie rendue (simulée).</b> Note calculée : <b>${String(res.score).replace('.', ',')} / ${res.max}</b>
        (${J.filter((j) => j.ok).length} / ${J.length} jalons).<br>${J.map((j) => `${j.ok ? '✓' : '✗'} ${j.jalon}${'adresse' in j ? ` (${j.adresse || 'non posée'})` : ''}`).join('<br>')}`;
      return { rendu: Date.now() };
    },
  });
  window.__essai = { db, moteur };
  document.querySelector('.ent-nav[data-vue="entrepot"]')?.click();
}
form.addEventListener('change', monter);
monter();
</script>
</body>
</html>
