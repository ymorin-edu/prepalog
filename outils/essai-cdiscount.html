<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — séances Cdiscount (Prepalog)</title>
<!-- Page d'ESSAI des séances Cdiscount ENT-2.x (chantier D), dans le vrai moteur d'entreprise.
     Pourquoi elle existe : une séance en cours d'écriture porte `pret: false`, et
     `activiteVisible()` la cache alors à TOUT le monde, enseignant compris — aucune tuile ne
     permet de l'ouvrir pour la valider à l'écran. Ici, on l'ouvre directement, comme un élève.
     Elle n'est liée nulle part et rien n'y est enregistré : la base vit en mémoire, un
     rechargement (ou « Recommencer ») repart de zéro. Le code du stock est STOCK24.
     Ouvrir avec `lancer.bat`, puis http://localhost:8000/outils/essai-cdiscount.html
     (après une livraison : Ctrl + Maj + R, sinon Chrome garde les anciens fichiers). -->
<base href="../">
<link rel="icon" href="./styles/logo.png">
<link rel="stylesheet" href="./styles/polices.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/inventaire.css">
<link rel="stylesheet" href="./styles/plan.css">
<link rel="stylesheet" href="./styles/grille.css">
<link rel="stylesheet" href="./styles/quiz.css">
<link rel="stylesheet" href="./styles/carte.css">
<style>
  .essai-reglages{ background:#fff7d6; border-bottom:1px solid #e8d48a; padding:8px 16px; font:14px/1.5 sans-serif; color:#3b3200 }
  .essai-reglages label{ display:inline-block; margin:2px 16px 2px 0; white-space:nowrap; font-weight:400 }
  .essai-reglages select{ width:auto; display:inline-block; padding:2px 4px }
  .essai-reglages button{ width:auto; padding:2px 10px }
  .essai-jalons{ margin:4px 0 0; font-size:13px }
  .essai-jalons span{ display:inline-block; margin-right:12px }
</style>
</head>
<body>
<form class="essai-reglages" id="reglages">
  <b>Page d'essai Cdiscount</b> — code du stock : <b>STOCK24</b>.
  <label>Séance <select name="seance">
    <option value="cdiscount-mouvements">ENT-2.1 — le stock raconte</option>
    <option value="cdiscount-chiffres">ENT-2.2 — ce que disent les chiffres</option>
    <option value="cdiscount-inventaire">ENT-2.3 — inventaire tournant</option>
    <option value="cdiscount-regularise">ENT-2.4 — régularisé à l'aveugle</option>
    <option value="cdiscount-compte-a-rebours">ENT-2.5 — évaluation, le compte à rebours</option>
    <option value="cdiscount-priorites">ENT-2.6 — bonus, cinq recomptages</option>
    <option value="cdiscount-bon-endroit" data-contenu="cdiscount-ent27">ENT-2.7 — pic de Noël, le bon endroit</option>
    <option value="cdiscount-par-lots" data-contenu="cdiscount-ent28">ENT-2.8 — pic de Noël, par lots</option>
    <option value="cdiscount-calcul-yanis" data-contenu="cdiscount-ent29">ENT-2.9 — pic de Noël, le calcul de Yanis</option>
    <option value="cdiscount-evaluation-noel" data-contenu="cdiscount-ent210">ENT-2.10 — pic de Noël, évaluation</option>
  </select></label>
  <button type="button" id="recommencer">Recommencer</button>
  <div class="essai-jalons" id="jalons"></div>
</form>
<div id="hote"></div>
<script type="module">
const form = document.getElementById('reglages');
const jalons = document.getElementById('jalons');
const PICTO = { ok: '✅', ko: '❌', attente: '⏳', na: '·' };

async function monter() {
  const id = new FormData(form).get('seance');
  const mod = await import(`./activites/${id}.js`);
  // Le contenu porte le nom de l'activité, sauf quand l'option dit le sien (séances du pic de Noël : `contenus/cdiscount-ent27.js`…).
  const contenu = await import(`./contenus/${form.querySelector('select[name="seance"]').selectedOptions[0].dataset.contenu || id}.js`);
  const db = {};
  const hote = document.getElementById('hote');
  hote.innerHTML = '';
  // Les jalons de la séance, relus à chaque sauvegarde : c'est ce que verrait l'enseignant.
  const afficher = () => {
    jalons.innerHTML = 'Jalons : ' + contenu.ETAPES.map((e) => {
      const r = e.verifier(db, { CATALOGUE: contenu.CATALOGUE });
      return `<span title="${(r.detail || '').replace(/"/g, '&quot;')}">${PICTO[r.status] || r.status} ${e.titre}</span>`;
    }).join('');
  };
  mod.rendre(hote, {
    meta: mod.meta,
    profil: { prenom: 'Essai', nom: 'Cdiscount', role: 'eleve' },
    jeu: { etat: () => db, sauver: afficher },
    enregistrer: afficher, quitter: () => { location.reload(); }, codeStock: 'STOCK24',
    // Une évaluation (copie rendue, ENT-2.5) : la remise reste dans cette page, rien n'est envoyé.
    lireScore: async () => null, rendreCopie: async () => ({ rendu: Date.now() }),
  });
  window.__essai = { db };
  afficher();
}
form.addEventListener('change', monter);
document.getElementById('recommencer').addEventListener('click', monter);
monter();
</script>
</body>
</html>
